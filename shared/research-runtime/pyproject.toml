[project]
name = "research-inference-runtime"
version = "0.1.0"
description = "MyOwnResearcher run context, scheduling, telemetry and inference adapters"
requires-python = ">=3.11"
dependencies = ["myown-llm-integrator==0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_codex", "research_agents", "research_runtime"]
